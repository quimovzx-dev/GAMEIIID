<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Park - The Perfect Loop</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        canvas { display: block; }
        
        /* UI Overlays */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); z-index: 10; color: white; transition: opacity 0.3s; }
        .hidden { display: none !important; }
        
        h1 { font-size: 42px; margin-bottom: 5px; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; text-align: center; text-transform: uppercase; }
        .subtitle { font-size: 16px; color: #aaa; margin-bottom: 30px; letter-spacing: 2px; }
        
        .action-btn { background: #00ffcc; color: #000; border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 30px; box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4); margin-bottom: 15px; text-transform: uppercase; }
        .action-btn:active { transform: scale(0.95); background: #00ccaa; }

        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; box-sizing: border-box; display: flex; justify-content: space-between; color: white; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 5; pointer-events: none; }
        .hud-box { background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); transition: all 0.2s; }
        
        /* Damage Flash Effect */
        #damage-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; pointer-events: none; z-index: 4; transition: opacity 0.2s; }
        .flash-active { opacity: 0.4 !important; }
        .text-red { color: #ff3366 !important; border-color: #ff3366 !important; }

        /* Status Message (e.g. "Straighten Up!") */
        #status-msg { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: bold; color: #ffcc00; text-shadow: 2px 2px 4px #000; opacity: 0; transition: opacity 0.3s; z-index: 5; }

        /* Mobile Controls */
        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 5; }
        .btn-group { display: flex; gap: 15px; }
        .ctrl-btn { width: 65px; height: 65px; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .ctrl-btn:active { background: rgba(0, 255, 204, 0.5); border-color: #00ffcc; transform: scale(0.95); }

        /* Results Screen Specifics */
        .stars { font-size: 40px; letter-spacing: 5px; margin-bottom: 10px; color: #333; }
        .star-earned { color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
        .score-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 16px; }
        .score-val { font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    
    <div id="damage-flash"></div>
    <div id="status-msg">PARK INSIDE THE ZONE</div>

    <!-- Main Menu -->
    <div id="menu-screen" class="overlay">
        <h1>TURBO PARK</h1>
        <div class="subtitle">LEVEL 1: THE LOT</div>
        <div style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-bottom: 30px; text-align: center; border: 1px solid #00ffcc;">
            <p style="margin: 0; font-size: 16px; color: #fff;">🅿️ PARK INSIDE THE ZONE</p>
            <p style="margin: 5px 0 0 0; font-size: 14px; color: #aaa;">Don't hit anything • Finish under 40s</p>
        </div>
        <button class="action-btn" id="start-btn">DRIVE</button>
    </div>

    <!-- Results Screen -->
    <div id="results-screen" class="overlay hidden">
        <h1 id="result-title">NEW BEST!</h1>
        <div class="stars" id="star-container">★★★</div>
        
        <div style="background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; margin-bottom: 20px; width: 280px;">
            <div class="score-row"><span>Time Left:</span> <span class="score-val" id="res-time">0s</span></div>
            <div class="score-row"><span>Damage:</span> <span class="score-val" id="res-damage" style="color: #ff3366;">0%</span></div>
            <div class="score-row"><span>Corrections:</span> <span class="score-val" id="res-corrections">0</span></div>
            <hr style="border-color: #444; margin: 15px 0;">
            <div class="score-row" style="font-size: 22px; color: #00ffcc;">
                <span>SCORE:</span> <span class="score-val" id="res-score">0</span>
            </div>
        </div>
        <button class="action-btn" id="retry-btn">RETRY LEVEL</button>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div class="hud-box" id="hud-time">TIME: <span id="timer">40</span>s</div>
        <div class="hud-box" id="hud-damage">DMG: <span id="damage">0</span>%</div>
    </div>
    
    <!-- Controls -->
    <div id="controls" class="controls hidden">
        <div class="btn-group">
            <div class="ctrl-btn" id="btn-left">◀</div>
            <div class="ctrl-btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group">
            <div class="ctrl-btn" id="btn-brake">⏬</div>
            <div class="ctrl-btn" id="btn-gas">⏫</div>
        </div>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.FogExp2(0x1a1a2e, 0.02);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffeedd, 0.8);
        dirLight.position.set(-10, 20, -10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        scene.add(dirLight);

        // Environment
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Procedural Car (Simplified for performance, retains physics bounds)
        const car = new THREE.Group();
        scene.add(car);
        
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3366 });
        const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.8), bodyMat);
        chassis.position.y = 0.6;
        chassis.castShadow = true;
        car.add(chassis);
        
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 2.4), new THREE.MeshStandardMaterial({ color: 0x222222 }));
        cabin.position.set(0, 1.25, -0.2);
        car.add(cabin);

        // Obstacles
        const obstacles = [];
        const obsGeo = new THREE.BoxGeometry(2.4, 1.2, 5);
        const obsMat = new THREE.MeshStandardMaterial({ color: 0x3366ff });

        const parkPositions = [[-5, 10], [5, 15], [-5, 20]];
        parkPositions.forEach(pos => {
            const obs = new THREE.Mesh(obsGeo, obsMat);
            obs.position.set(pos[0], 0.6, pos[1]);
            obs.castShadow = true;
            scene.add(obs);
            obstacles.push(obs);
        });

        // Walls to enclose the level
        const wallGeo = new THREE.BoxGeometry(30, 2, 1);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
        const backWall = new THREE.Mesh(wallGeo, wallMat);
        backWall.position.set(0, 1, 35);
        scene.add(backWall);
        obstacles.push(backWall);

        // Parking Zone
        const zoneGroup = new THREE.Group();
        zoneGroup.position.set(5, 0.05, 25);
        scene.add(zoneGroup);

        const zoneMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(3.5, 6), 
            new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true })
        );
        zoneMesh.rotation.x = -Math.PI / 2;
        zoneGroup.add(zoneMesh);

        const glowMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(3.3, 5.8), 
            new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.2 })
        );
        glowMesh.rotation.x = -Math.PI / 2;
        zoneGroup.add(glowMesh);

        // Game State
        let gameState = 'MENU';
        let velocity = 0;
        let steeringAngle = 0;
        let carHeading = 0;
        
        const MAX_SPEED = 0.35;
        const MAX_REVERSE = -0.2;
        const ACCEL = 0.01;
        const BRAKE_FORCE = 0.015;
        const FRICTION = 0.98;

        let damage = 0;
        let timeLeft = 40;
        let timerInterval;
        let corrections = 0;
        let lastActionWasReverse = false;

        const inputs = { gas: false, brake: false, left: false, right: false };

        const bindBtn = (id, key) => {
            const btn = document.getElementById(id);
            const press = (e) => { 
                e.preventDefault(); 
                inputs[key] = true;
                
                // Track gear shifting corrections
                if(key === 'brake' && velocity > 0 && !lastActionWasReverse) {
                    corrections++;
                    lastActionWasReverse = true;
                } else if (key === 'gas' && velocity < 0 && lastActionWasReverse) {
                    corrections++;
                    lastActionWasReverse = false;
                }
            };
            const release = (e) => { e.preventDefault(); inputs[key] = false; };
            
            btn.addEventListener('touchstart', press, {passive: false});
            btn.addEventListener('touchend', release, {passive: false});
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
        };
        
        bindBtn('btn-gas', 'gas');
        bindBtn('btn-brake', 'brake');
        bindBtn('btn-left', 'left');
        bindBtn('btn-right', 'right');

        function showMessage(text, duration = 2000) {
            const msgEl = document.getElementById('status-msg');
            msgEl.innerText = text;
            msgEl.style.opacity = 1;
            setTimeout(() => { msgEl.style.opacity = 0; }, duration);
        }

        function startGame() {
            car.position.set(0, 0, 0);
            carHeading = 0;
            velocity = 0;
            steeringAngle = 0;
            damage = 0;
            timeLeft = 40;
            corrections = 0;
            lastActionWasReverse = false;
            
            document.getElementById('damage').innerText = damage;
            document.getElementById('hud-damage').classList.remove('text-red');
            document.getElementById('timer').innerText = timeLeft;
            
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            
            gameState = 'PLAYING';
            showMessage("PARK IN THE GREEN ZONE!", 3000);
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(gameState === 'PLAYING') {
                    timeLeft--;
                    document.getElementById('timer').innerText = timeLeft;
                    if(timeLeft <= 0) endGame(false, "TIME UP!");
                }
            }, 1000);
        }

        function endGame(success, titleText) {
            gameState = 'RESULTS';
            clearInterval(timerInterval);
            
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            
            const titleEl = document.getElementById('result-title');
            titleEl.innerText = titleText;
            titleEl.style.color = success ? "#00ffcc" : "#ff3366";

            document.getElementById('res-time').innerText = timeLeft + "s";
            document.getElementById('res-damage').innerText = damage + "%";
            document.getElementById('res-corrections').innerText = corrections;

            let finalScore = 0;
            let stars = 0;

            if(success) {
                // Base score + time bonus - damage penalty - correction penalty
                finalScore = 1000 + (timeLeft * 20) - (damage * 10) - (corrections * 15);
                if(finalScore < 100) finalScore = 100; // Minimum win score
                
                if(damage === 0 && timeLeft > 15) stars = 3;
                else if (damage < 40 && timeLeft > 5) stars = 2;
                else stars = 1;
            } else {
                finalScore = 0;
                stars = 0;
            }

            document.getElementById('res-score').innerText = finalScore;
            
            // Render stars
            let starHTML = "";
            for(let i=0; i<3; i++) {
                starHTML += i < stars ? "<span class='star-earned'>★</span>" : "★";
            }
            document.getElementById('star-container').innerHTML = starHTML;
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('retry-btn').addEventListener('click', startGame);

        function animate() {
            requestAnimationFrame(animate);

            if (gameState === 'PLAYING') {
                // Physics
                if (inputs.gas) {
                    velocity += ACCEL;
                    if (velocity > MAX_SPEED) velocity = MAX_SPEED;
                } else if (inputs.brake) {
                    velocity -= BRAKE_FORCE;
                    if (velocity < MAX_REVERSE) velocity = MAX_REVERSE;
                } else {
                    velocity *= FRICTION;
                }

                if (inputs.left) {
                    steeringAngle += 0.05;
                    if(steeringAngle > 0.6) steeringAngle = 0.6;
                } else if (inputs.right) {
                    steeringAngle -= 0.05;
                    if(steeringAngle < -0.6) steeringAngle = -0.6;
                } else {
                    steeringAngle *= 0.8;
                }

                if (Math.abs(velocity) > 0.001) {
                    carHeading += (velocity / (2.4 / Math.sin(steeringAngle || 0.001)));
                }

                car.rotation.y = carHeading;
                car.position.x += Math.sin(carHeading) * velocity;
                car.position.z += Math.cos(carHeading) * velocity;

                // Collision checking
                car.updateMatrixWorld();
                const carBox = new THREE.Box3().setFromObject(chassis);
                
                let crashed = false;
                obstacles.forEach(obs => {
                    const obsBox = new THREE.Box3().setFromObject(obs);
                    if (carBox.intersectsBox(obsBox)) crashed = true;
                });

                if (crashed) {
                    velocity = -velocity * 0.5; // Bounce
                    damage += 20;
                    
                    // Visual Feedback
                    document.getElementById('damage').innerText = damage;
                    const flash = document.getElementById('damage-flash');
                    flash.classList.add('flash-active');
                    setTimeout(() => flash.classList.remove('flash-active'), 150);
                    
                    if(damage >= 60) document.getElementById('hud-damage').classList.add('text-red');
                    if (damage >= 100) endGame(false, "WRECKED!");
                }

                // FIXED: Parking Detection Logic
                const distToZoneCenter = car.position.distanceTo(zoneGroup.position);
                
                // If the car's center is within 2.5 units of the zone's center, and practically stopped
                if (distToZoneCenter < 2.5 && Math.abs(velocity) < 0.01) {
                    
                    // Check alignment (Car heading vs Zone rotation)
                    let angleDiff = Math.abs((carHeading % Math.PI) - (zoneGroup.rotation.y % Math.PI));
                    if (angleDiff > Math.PI / 2) angleDiff = Math.PI - angleDiff; // Account for parking backwards
                    
                    if (angleDiff < 0.4) {
                        endGame(true, "PERFECT PARK!");
                    } else {
                        showMessage("STRAIGHTEN UP!", 1000);
                    }
                }

                // Camera follow
                const camOffset = new THREE.Vector3(-Math.sin(carHeading) * 10, 6, -Math.cos(carHeading) * 10);
                const targetCamPos = car.position.clone().add(camOffset);
                camera.position.lerp(targetCamPos, 0.1);
                camera.lookAt(car.position.x, car.position.y + 1, car.position.z);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
