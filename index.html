<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Park 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 0 #000; pointer-events: none; }
        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; }
        .btn { width: 70px; height: 70px; background: rgba(255, 255, 255, 0.3); border: 2px solid white; border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; user-select: none; }
        .btn:active { background: rgba(255, 255, 255, 0.6); }
        #message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #32cd32; font-size: 40px; font-weight: bold; text-shadow: 2px 2px 0 #000; display: none; }
    </style>
    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">Time: <span id="timer">30</span> | Damage: <span id="damage">0</span>%</div>
    <div id="message">PERFECT PARK!</div>
    
    <div class="controls">
        <div class="btn-group">
            <div class="btn" id="btn-left">⬅️</div>
            <div class="btn" id="btn-right">➡️</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="btn-brake">🛑</div>
            <div class="btn" id="btn-gas">⏫</div>
        </div>
    </div>

    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Ground
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 2. The Car
        const carGroup = new THREE.Group();
        const carGeo = new THREE.BoxGeometry(2, 1, 4);
        const carMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const carBody = new THREE.Mesh(carGeo, carMat);
        carBody.position.y = 0.5;
        carBody.castShadow = true;
        carGroup.add(carBody);
        scene.add(carGroup);

        // 3. Environment (Obstacles & Parking Zone)
        const obstacles = [];
        const boxGeo = new THREE.BoxGeometry(2, 2, 2);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0xffa500 }); // Orange boxes
        
        const positions = [[-5, 5], [5, 10], [0, 15], [-5, 20]];
        positions.forEach(pos => {
            const obs = new THREE.Mesh(boxGeo, boxMat);
            obs.position.set(pos[0], 1, pos[1]);
            obs.castShadow = true;
            scene.add(obs);
            obstacles.push(obs);
        });

        // Parking Zone
        const zoneGeo = new THREE.BoxGeometry(3, 0.1, 6);
        const zoneMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
        const parkingZone = new THREE.Mesh(zoneGeo, zoneMat);
        parkingZone.position.set(5, 0.05, 25);
        scene.add(parkingZone);

        // 4. Physics & Game Logic Variables
        let speed = 0;
        let angle = 0;
        const maxSpeed = 0.3;
        const acceleration = 0.01;
        const friction = 0.95;
        let damage = 0;
        let timeLeft = 30;
        let gameOver = false;

        const inputs = { gas: false, brake: false, left: false, right: false };

        // 5. Touch Controls
        const bindButton = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); inputs[key] = false; });
        };
        bindButton('btn-gas', 'gas');
        bindButton('btn-brake', 'brake');
        bindButton('btn-left', 'left');
        bindButton('btn-right', 'right');

        // Timer
        const timerInterval = setInterval(() => {
            if(!gameOver) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if(timeLeft <= 0) {
                    gameOver = true;
                    document.getElementById('message').innerText = "TIME UP!";
                    document.getElementById('message').style.display = "block";
                    document.getElementById('message').style.color = "red";
                }
            }
        }, 1000);

        // 6. Main Game Loop
        function animate() {
            requestAnimationFrame(animate);

            if (!gameOver) {
                // Movement
                if (inputs.gas) speed += acceleration;
                if (inputs.brake) speed -= acceleration;
                speed *= friction; // apply friction

                if (inputs.left && Math.abs(speed) > 0.01) angle += 0.05 * Math.sign(speed);
                if (inputs.right && Math.abs(speed) > 0.01) angle -= 0.05 * Math.sign(speed);

                carGroup.rotation.y = angle;
                carGroup.position.x += Math.sin(angle) * speed;
                carGroup.position.z += Math.cos(angle) * speed;

                // Simple Bounding Box Collision
                const carBox = new THREE.Box3().setFromObject(carGroup);
                
                // Obstacle Collision
                obstacles.forEach(obs => {
                    const obsBox = new THREE.Box3().setFromObject(obs);
                    if (carBox.intersectsBox(obsBox)) {
                        speed = -speed * 0.5; // Bounce back
                        damage += 10;
                        document.getElementById('damage').innerText = damage;
                        if(damage >= 100) {
                            gameOver = true;
                            document.getElementById('message').innerText = "WRECKED!";
                            document.getElementById('message').style.display = "block";
                            document.getElementById('message').style.color = "red";
                        }
                    }
                });

                // Parking Detection
                const zoneBox = new THREE.Box3().setFromObject(parkingZone);
                if (carBox.intersectsBox(zoneBox) && Math.abs(speed) < 0.02) {
                    gameOver = true;
                    document.getElementById('message').style.display = "block";
                }

                // Camera follow
                camera.position.x = carGroup.position.x - Math.sin(angle) * 10;
                camera.position.z = carGroup.position.z - Math.cos(angle) * 10;
                camera.position.y = carGroup.position.y + 5;
                camera.lookAt(carGroup.position);
            }

            renderer.render(scene, camera);
        }

        animate();

        // Handle Screen Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
