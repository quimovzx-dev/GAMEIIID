<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Park - The Real Car Update</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; touch-action: none; font-family: 'Segoe UI', sans-serif; user-select: none; }
        canvas { display: block; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); z-index: 10; color: white; }
        .hidden { display: none !important; }
        
        h1 { font-size: 38px; margin-bottom: 5px; color: #00ffcc; text-transform: uppercase; letter-spacing: 2px; }
        h2 { font-size: 28px; color: #ffcc00; margin: 10px 0; }
        
        .action-btn { background: #00ffcc; color: #000; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 30px; margin: 10px; text-transform: uppercase; }
        .action-btn:active { transform: scale(0.95); background: #00ccaa; }

        #hud { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; box-sizing: border-box; display: flex; justify-content: space-between; color: white; font-size: 16px; font-weight: bold; z-index: 5; pointer-events: none; }
        .hud-box { background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); }
        
        #cam-btn-container { position: absolute; top: 15px; right: 15px; z-index: 6; }
        .cam-btn { background: rgba(0,0,0,0.6); color: #00ffcc; border: 1px solid #00ffcc; padding: 10px; border-radius: 8px; font-weight: bold; }

        #damage-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; pointer-events: none; z-index: 4; transition: opacity 0.1s; }
        .flash-active { opacity: 0.4 !important; }

        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; box-sizing: border-box; z-index: 5; }
        .btn-group { display: flex; gap: 10px; }
        .ctrl-btn { width: 65px; height: 65px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; }
        .ctrl-btn:active { background: rgba(0, 255, 204, 0.4); border-color: #00ffcc; transform: scale(0.95); }

        .score-board { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; margin-bottom: 20px; width: 280px; }
        .score-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 16px; }
        .stars { font-size: 36px; letter-spacing: 5px; margin-bottom: 10px; color: #333; }
        .star-earned { color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    
    <div id="damage-flash"></div>

    <!-- UI Overlay: Main Menu -->
    <div id="menu-screen" class="overlay">
        <h1>TURBO PARK</h1>
        <p style="color:#aaa;">Pro Series • No more blocks</p>
        <button class="action-btn" id="start-btn">IGNITION</button>
    </div>

    <!-- UI Overlay: Results -->
    <div id="results-screen" class="overlay hidden">
        <h2 id="result-title">✨ PERFECT PARK ✨</h2>
        <div class="stars" id="star-container">★★★</div>
        
        <div class="score-board">
            <div class="score-row"><span>Position:</span> <span id="res-pos">0%</span></div>
            <div class="score-row"><span>Alignment:</span> <span id="res-align">0%</span></div>
            <div class="score-row"><span>Damage:</span> <span id="res-damage" style="color: #ff3366;">0%</span></div>
            <div class="score-row"><span>Time:</span> <span id="res-time">0s</span></div>
            <div class="score-row"><span>Corrections:</span> <span id="res-corr">0</span></div>
            <hr style="border-color: #444; margin: 15px 0;">
            <div class="score-row" style="font-size: 22px; color: #00ffcc; font-weight: bold;">
                <span>SCORE:</span> <span id="res-total">0/100</span>
            </div>
            <div id="record-msg" style="color: #ffcc00; text-align: center; font-size: 14px; margin-top: 10px; display: none;">NEW RECORD!</div>
        </div>
        
        <div style="display: flex;">
            <button class="action-btn" id="retry-btn">RETRY</button>
            <button class="action-btn" style="background: #444; color: white;">NEXT</button>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div class="hud-box">TIME: <span id="timer">40</span>s</div>
        <div class="hud-box">DMG: <span id="damage">0</span>%</div>
    </div>
    
    <div id="cam-btn-container" class="hidden">
        <button class="cam-btn" id="cam-toggle">🎥 CHASE</button>
    </div>

    <!-- Mobile Controls -->
    <div id="controls" class="controls hidden">
        <div class="btn-group">
            <div class="ctrl-btn" id="btn-left">◀</div>
            <div class="ctrl-btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group">
            <div class="ctrl-btn" id="btn-brake">🛑</div>
            <div class="ctrl-btn" id="btn-gas">⏫</div>
        </div>
    </div>

    <script>
        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111116);
        scene.fog = new THREE.FogExp2(0x111116, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting for metallic reflections
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);
        
        const dirLight = new THREE.DirectionalLight(0xffeedd, 0.8);
        dirLight.position.set(-10, 15, -10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 15;
        dirLight.shadow.camera.bottom = -15;
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        scene.add(dirLight);

        // Environment
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.7, metalness: 0.2 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- PROCEDURAL SPORTS CAR ---
        const car = new THREE.Group();
        scene.add(car);

        // Materials
        const paintMat = new THREE.MeshStandardMaterial({ color: 0x0033aa, metalness: 0.8, roughness: 0.2 }); // Deep metallic blue
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x050505, metalness: 0.9, roughness: 0.1 }); // Dark tint
        const trimMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        
        // Dynamic Light Materials
        const brakeMat = new THREE.MeshStandardMaterial({ color: 0x550000, emissive: 0x000000 });
        const reverseMat = new THREE.MeshStandardMaterial({ color: 0x555555, emissive: 0x000000 });
        const headLightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1 });

        // Lower Chassis (Wide, sleek)
        const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.5, 4.8), paintMat);
        chassis.position.y = 0.45;
        chassis.castShadow = true;
        car.add(chassis);

        // Front Splitter / Bumper
        const nose = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.3, 1.0), paintMat);
        nose.position.set(0, 0.35, 2.7);
        nose.castShadow = true;
        car.add(nose);

        // Cabin (Angled back)
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.45, 2.2), glassMat);
        cabin.position.set(0, 0.9, -0.3);
        cabin.castShadow = true;
        car.add(cabin);

        // Spoiler
        const spoilerWing = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.05, 0.4), trimMat);
        spoilerWing.position.set(0, 1.0, -2.2);
        spoilerWing.castShadow = true;
        car.add(spoilerWing);
        const strutL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.3, 0.2), trimMat);
        strutL.position.set(-0.8, 0.85, -2.2);
        car.add(strutL);
        const strutR = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.3, 0.2), trimMat);
        strutR.position.set(0.8, 0.85, -2.2);
        car.add(strutR);

        // Lights
        const hlL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.1), headLightMat);
        hlL.position.set(-0.7, 0.5, 2.45);
        car.add(hlL);
        const hlR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.1), headLightMat);
        hlR.position.set(0.7, 0.5, 2.45);
        car.add(hlR);

        const tlL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.1), brakeMat);
        tlL.position.set(-0.7, 0.6, -2.41);
        car.add(tlL);
        const tlR = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.1), brakeMat);
        tlR.position.set(0.7, 0.6, -2.41);
        car.add(tlR);

        const revL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.1), reverseMat);
        revL.position.set(-0.3, 0.6, -2.41);
        car.add(revL);
        const revR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.1), reverseMat);
        revR.position.set(0.3, 0.6, -2.41);
        car.add(revR);

        // Headlight Beams
        const spotL = new THREE.SpotLight(0xffffee, 1.5, 30, 0.6, 0.5, 1);
        spotL.position.set(-0.7, 0.5, 2.5);
        spotL.target.position.set(-0.7, 0, 10);
        car.add(spotL);
        car.add(spotL.target);
        const spotR = new THREE.SpotLight(0xffffee, 1.5, 30, 0.6, 0.5, 1);
        spotR.position.set(0.7, 0.5, 2.5);
        spotR.target.position.set(0.7, 0, 10);
        car.add(spotR);
        car.add(spotR.target);

        // Detailed Wheels
        const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 16);
        wheelGeo.rotateZ(Math.PI / 2);
        const rimGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.27, 8); // Octagon to look like spokes
        rimGeo.rotateZ(Math.PI / 2);
        
        const tireMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9 });
        const rimMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.3 });

        const createWheel = (x, z) => {
            const group = new THREE.Group();
            const tire = new THREE.Mesh(wheelGeo, tireMat);
            const rim = new THREE.Mesh(rimGeo, rimMaterial);
            tire.castShadow = true;
            group.add(tire);
            group.add(rim);
            group.position.set(x, 0.35, z);
            car.add(group);
            return group;
        };

        const wFL = createWheel(-1.1, 1.5);
        const wFR = createWheel(1.1, 1.5);
        const wRL = createWheel(-1.1, -1.5);
        const wRR = createWheel(1.1, -1.5);

        // --- LEVEL DESIGN ---
        const obstacles = [];
        const obsGeo = new THREE.BoxGeometry(2.2, 1.2, 4.8);
        const obsMat = new THREE.MeshStandardMaterial({ color: 0x882222, roughness: 0.6 });

        // Add parked cars as obstacles
        [[-5, 12], [5, 18], [-5, 24]].forEach(pos => {
            const obs = new THREE.Mesh(obsGeo, obsMat);
            obs.position.set(pos[0], 0.6, pos[1]);
            obs.castShadow = true;
            scene.add(obs);
            obstacles.push(obs);
        });

        // Walls
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const wall = new THREE.Mesh(new THREE.BoxGeometry(30, 2, 1), wallMat);
        wall.position.set(0, 1, 32);
        scene.add(wall);
        obstacles.push(wall);

        // Parking Zone
        const zoneGroup = new THREE.Group();
        zoneGroup.position.set(5, 0.05, 28);
        scene.add(zoneGroup);

        const zoneMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(3.2, 6.2), 
            new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true })
        );
        zoneMesh.rotation.x = -Math.PI / 2;
        zoneGroup.add(zoneMesh);

        // --- CAMERA SYSTEM ---
        const CAM_MODES = [
            { name: 'CHASE', offset: new THREE.Vector3(0, 4, -9), lookOffset: new THREE.Vector3(0, 1, 3) },
            { name: 'CLOSE', offset: new THREE.Vector3(0, 2, -5), lookOffset: new THREE.Vector3(0, 0.5, 2) },
            { name: 'HOOD', offset: new THREE.Vector3(0, 1.2, 0.5), lookOffset: new THREE.Vector3(0, 0.5, 10) },
            { name: 'REVERSE', offset: new THREE.Vector3(0, 3, 7), lookOffset: new THREE.Vector3(0, 0, -5) }
        ];
        let currentCamIdx = 0;
        
        document.getElementById('cam-toggle').addEventListener('click', () => {
            currentCamIdx = (currentCamIdx + 1) % CAM_MODES.length;
            document.getElementById('cam-toggle').innerText = "🎥 " + CAM_MODES[currentCamIdx].name;
        });

        // --- GAME LOGIC ---
        let gameState = 'MENU';
        let velocity = 0;
        let steeringAngle = 0;
        let carHeading = 0;
        let damage = 0;
        let timeLeft = 40;
        let timerInterval;
        let corrections = 0;
        let highscore = 0;

        const inputs = { gas: false, brake: false, left: false, right: false };

        const bindBtn = (id, key) => {
            const btn = document.getElementById(id);
            const press = (e) => { e.preventDefault(); inputs[key] = true; };
            const release = (e) => { e.preventDefault(); inputs[key] = false; };
            btn.addEventListener('touchstart', press, {passive: false});
            btn.addEventListener('touchend', release, {passive: false});
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
        };
        bindBtn('btn-gas', 'gas'); bindBtn('btn-brake', 'brake');
        bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right');

        // Correction tracking (shifting gears)
        let lastDir = 0;

        function startGame() {
            car.position.set(0, 0, 0);
            carHeading = 0;
            velocity = 0; steeringAngle = 0; damage = 0; timeLeft = 40; corrections = 0; lastDir = 0;
            
            document.getElementById('damage').innerText = damage;
            document.getElementById('timer').innerText = timeLeft;
            
            document.querySelectorAll('.overlay').forEach(e => e.classList.add('hidden'));
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            document.getElementById('cam-btn-container').classList.remove('hidden');
            
            gameState = 'PLAYING';
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(gameState === 'PLAYING') {
                    timeLeft--;
                    document.getElementById('timer').innerText = timeLeft;
                    if(timeLeft <= 0) endGame(false, "TIME UP");
                }
            }, 1000);
        }

        function endGame(success, title) {
            gameState = 'RESULTS';
            clearInterval(timerInterval);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('cam-btn-container').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            
            document.getElementById('result-title').innerText = title;
            document.getElementById('result-title').style.color = success ? "#00ffcc" : "#ff3366";

            if(success) {
                // Brutal Scoring Calculation
                const dist = car.position.distanceTo(zoneGroup.position);
                const posScore = Math.max(0, Math.round(100 - (dist * 30)));
                
                let angleDiff = Math.abs((carHeading % Math.PI) - (zoneGroup.rotation.y % Math.PI));
                if (angleDiff > Math.PI / 2) angleDiff = Math.PI - angleDiff;
                const alignScore = Math.max(0, Math.round(100 - (angleDiff * 80)));
                
                const finalScore = Math.round((posScore * 0.4) + (alignScore * 0.4) + ((40-timeLeft)*0.1) - damage - (corrections*2));
                const clampedScore = Math.max(0, Math.min(100, finalScore));

                document.getElementById('res-pos').innerText = posScore + "%";
                document.getElementById('res-align').innerText = alignScore + "%";
                document.getElementById('res-damage').innerText = damage + "%";
                document.getElementById('res-time').innerText = (40 - timeLeft) + "s";
                document.getElementById('res-corr').innerText = corrections;
                document.getElementById('res-total').innerText = clampedScore + "/100";

                let stars = clampedScore >= 90 ? 3 : clampedScore >= 70 ? 2 : 1;
                document.getElementById('star-container').innerHTML = 
                    "<span class='star-earned'>★</span>".repeat(stars) + "★".repeat(3-stars);

                if (clampedScore > highscore) {
                    highscore = clampedScore;
                    document.getElementById('record-msg').style.display = "block";
                } else {
                    document.getElementById('record-msg').style.display = "none";
                }
            } else {
                document.getElementById('res-pos').innerText = "0%";
                document.getElementById('res-align').innerText = "0%";
                document.getElementById('res-damage').innerText = damage + "%";
                document.getElementById('res-time').innerText = "DNF";
                document.getElementById('res-corr').innerText = corrections;
                document.getElementById('res-total').innerText = "0/100";
                document.getElementById('star-container').innerHTML = "★★★";
            }
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('retry-btn').addEventListener('click', startGame);

        function animate() {
            requestAnimationFrame(animate);

            if (gameState === 'PLAYING') {
                // Logic & Physics
                if (inputs.gas) {
                    velocity += 0.01;
                    if (velocity > 0.4) velocity = 0.4;
                } else if (inputs.brake) {
                    velocity -= 0.015;
                    if (velocity < -0.2) velocity = -0.2;
                } else {
                    velocity *= 0.97; // Coast
                }

                // Track directional corrections
                let currentDir = velocity > 0.05 ? 1 : velocity < -0.05 ? -1 : lastDir;
                if(currentDir !== lastDir && currentDir !== 0) {
                    corrections++;
                    lastDir = currentDir;
                }

                // Car Animations (Lights)
                if (inputs.brake && velocity > 0.05) brakeMat.emissive.setHex(0xff0000);
                else brakeMat.emissive.setHex(0x000000);

                if (velocity < -0.05 || (inputs.brake && velocity <= 0.05)) reverseMat.emissive.setHex(0xffffff);
                else reverseMat.emissive.setHex(0x000000);

                // Steering
                if (inputs.left) {
                    steeringAngle += 0.05;
                    if(steeringAngle > 0.6) steeringAngle = 0.6;
                } else if (inputs.right) {
                    steeringAngle -= 0.05;
                    if(steeringAngle < -0.6) steeringAngle = -0.6;
                } else {
                    steeringAngle *= 0.8;
                }

                // Apply Steering visually to front wheels
                wFL.rotation.y = steeringAngle;
                wFR.rotation.y = steeringAngle;

                if (Math.abs(velocity) > 0.001) {
                    carHeading += (velocity / (2.6 / Math.sin(steeringAngle || 0.001)));
                    
                    // Wheel spinning
                    const spin = velocity / 0.35;
                    wFL.rotation.x -= spin; wFR.rotation.x -= spin;
                    wRL.rotation.x -= spin; wRR.rotation.x -= spin;
                }

                car.rotation.y = carHeading;
                car.position.x += Math.sin(carHeading) * velocity;
                car.position.z += Math.cos(carHeading) * velocity;

                // Collisions (Bounding Box)
                car.updateMatrixWorld();
                const carBox = new THREE.Box3().setFromObject(chassis);
                
                let crashed = false;
                obstacles.forEach(obs => {
                    if (carBox.intersectsBox(new THREE.Box3().setFromObject(obs))) crashed = true;
                });

                if (crashed) {
                    velocity = -velocity * 0.5;
                    damage += 15;
                    document.getElementById('damage').innerText = damage;
                    
                    const flash = document.getElementById('damage-flash');
                    flash.classList.add('flash-active');
                    setTimeout(() => flash.classList.remove('flash-active'), 100);
                    
                    if (damage >= 100) endGame(false, "VEHICLE DISABLED");
                }

                // Parking Check
                if (car.position.distanceTo(zoneGroup.position) < 2.5 && Math.abs(velocity) < 0.01) {
                    let angleDiff = Math.abs((carHeading % Math.PI) - (zoneGroup.rotation.y % Math.PI));
                    if (angleDiff > Math.PI / 2) angleDiff = Math.PI - angleDiff;
                    if (angleDiff < 0.4) endGame(true, "✨ PERFECT PARK ✨");
                }

                // Camera System
                const mode = CAM_MODES[currentCamIdx];
                const rotatedOffset = mode.offset.clone().applyAxisAngle(new THREE.Vector3(0,1,0), carHeading);
                const targetPos = car.position.clone().add(rotatedOffset);
                
                // Smoother lerp for cinematic feel
                camera.position.lerp(targetPos, 0.1);
                
                const rotatedLook = mode.lookOffset.clone().applyAxisAngle(new THREE.Vector3(0,1,0), carHeading);
                camera.lookAt(car.position.clone().add(rotatedLook));
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
