<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Park 3D - Pro Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        canvas { display: block; }
        
        /* UI Overlays */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); z-index: 10; color: white; transition: opacity 0.3s; }
        .hidden { display: none !important; }
        
        h1 { font-size: 48px; margin-bottom: 10px; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; text-align: center; }
        h2 { font-size: 32px; color: #ff3366; }
        p { font-size: 18px; max-width: 80%; text-align: center; color: #aaa; margin-bottom: 30px; }
        
        .action-btn { background: #00ffcc; color: #000; border: none; padding: 15px 40px; font-size: 24px; font-weight: bold; border-radius: 30px; box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4); margin-bottom: 15px; }
        .action-btn:active { transform: scale(0.95); background: #00ccaa; }

        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; box-sizing: border-box; display: flex; justify-content: space-between; color: white; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 5; pointer-events: none; }
        .hud-box { background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); }
        .damage-high { color: #ff3366; }

        /* Mobile Controls */
        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 5; }
        .btn-group { display: flex; gap: 15px; }
        .ctrl-btn { width: 65px; height: 65px; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .ctrl-btn:active { background: rgba(0, 255, 204, 0.5); border-color: #00ffcc; transform: scale(0.95); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    
    <!-- Main Menu -->
    <div id="menu-screen" class="overlay">
        <h1>TURBO PARK</h1>
        <p>Pro Driving Physics. Spin the wheels. Park perfectly.</p>
        <button class="action-btn" id="start-btn">START ENGINE</button>
    </div>

    <!-- Results Screen -->
    <div id="results-screen" class="overlay hidden">
        <h1 id="result-title">PARKED!</h1>
        <div style="background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: left; width: 250px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;"><span>Base Score:</span> <span>1000</span></div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; color: #ffcc00;"><span>Time Bonus:</span> <span id="score-time">0</span></div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; color: #ff3366;"><span>Damage Penalty:</span> <span id="score-damage">0</span></div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; color: #00ffcc;"><span>Accuracy Bonus:</span> <span id="score-accuracy">0</span></div>
            <hr style="border-color: #444; my: 10px;">
            <div style="display: flex; justify-content: space-between; font-size: 24px; font-weight: bold;"><span>TOTAL:</span> <span id="score-total">0</span></div>
        </div>
        <button class="action-btn" id="retry-btn">NEXT LEVEL</button>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div class="hud-box">TIME: <span id="timer">45</span>s</div>
        <div class="hud-box">DMG: <span id="damage">0</span>%</div>
    </div>
    
    <!-- Controls -->
    <div id="controls" class="controls hidden">
        <div class="btn-group">
            <div class="ctrl-btn" id="btn-left">◀</div>
            <div class="ctrl-btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group">
            <div class="ctrl-btn" id="btn-brake">⏬</div>
            <div class="ctrl-btn" id="btn-gas">⏫</div>
        </div>
    </div>

    <script>
        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.FogExp2(0x1a1a2e, 0.015);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const moonLight = new THREE.DirectionalLight(0x88bbff, 0.6);
        moonLight.position.set(-20, 50, -20);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 1024;
        moonLight.shadow.mapSize.height = 1024;
        moonLight.shadow.camera.near = 0.5;
        moonLight.shadow.camera.far = 150;
        moonLight.shadow.camera.left = -30;
        moonLight.shadow.camera.right = 30;
        moonLight.shadow.camera.top = 30;
        moonLight.shadow.camera.bottom = -30;
        scene.add(moonLight);

        // --- ENVIRONMENT (CITY) ---
        const envGroup = new THREE.Group();
        scene.add(envGroup);

        // Asphalt
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        envGroup.add(ground);

        // Road markings
        const lineGeo = new THREE.PlaneGeometry(0.5, 5);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for(let i = -50; i < 50; i += 10) {
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(0, 0.01, i);
            envGroup.add(line);
        }

        // Buildings (Procedural skyline)
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3e, roughness: 0.9 });
        for(let i = 0; i < 20; i++) {
            const height = Math.random() * 20 + 10;
            const bGeo = new THREE.BoxGeometry(10, height, 10);
            const building = new THREE.Mesh(bGeo, buildingMat);
            const x = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 40 + 20);
            const z = Math.random() * 100 - 50;
            building.position.set(x, height/2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            envGroup.add(building);
        }

        // --- PROCEDURAL 3D CAR ---
        // Instead of a single box, we build a detailed car model with Three.js primitives
        const car = new THREE.Group();
        scene.add(car);

        // Car Materials
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3366, metalness: 0.3, roughness: 0.4 });
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9 });
        const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });

        // Chassis (Lower body)
        const chassisGeo = new THREE.BoxGeometry(2.2, 0.6, 4.8);
        const chassis = new THREE.Mesh(chassisGeo, bodyMat);
        chassis.position.y = 0.5;
        chassis.castShadow = true;
        car.add(chassis);

        // Cabin (Upper body/windows)
        const cabinGeo = new THREE.BoxGeometry(1.8, 0.5, 2.4);
        const cabin = new THREE.Mesh(cabinGeo, glassMat);
        cabin.position.set(0, 1.05, -0.2);
        cabin.castShadow = true;
        car.add(cabin);

        // Headlights (Meshes + Actual Lights)
        const hlGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
        const hlMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const hlLeft = new THREE.Mesh(hlGeo, hlMat);
        hlLeft.position.set(-0.7, 0.6, 2.41);
        car.add(hlLeft);
        
        const hlRight = new THREE.Mesh(hlGeo, hlMat);
        hlRight.position.set(0.7, 0.6, 2.41);
        car.add(hlRight);

        const spotLightL = new THREE.SpotLight(0xffffee, 1, 40, 0.5, 0.5, 1);
        spotLightL.position.set(-0.7, 0.6, 2.5);
        spotLightL.target.position.set(-0.7, 0, 10);
        car.add(spotLightL);
        car.add(spotLightL.target);

        const spotLightR = new THREE.SpotLight(0xffffee, 1, 40, 0.5, 0.5, 1);
        spotLightR.position.set(0.7, 0.6, 2.5);
        spotLightR.target.position.set(0.7, 0, 10);
        car.add(spotLightR);
        car.add(spotLightR.target);

        // Wheels
        const wheelRadius = 0.4;
        const wheelGeo = new THREE.CylinderGeometry(wheelRadius, wheelRadius, 0.3, 16);
        wheelGeo.rotateZ(Math.PI / 2); // Lay flat
        const rimGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.32, 8);
        rimGeo.rotateZ(Math.PI / 2);

        const createWheel = (x, z) => {
            const wheelGroup = new THREE.Group();
            const tire = new THREE.Mesh(wheelGeo, wheelMat);
            const rim = new THREE.Mesh(rimGeo, rimMat);
            tire.castShadow = true;
            wheelGroup.add(tire);
            wheelGroup.add(rim);
            wheelGroup.position.set(x, wheelRadius, z);
            car.add(wheelGroup);
            return wheelGroup;
        };

        const wFL = createWheel(-1.2, 1.5);
        const wFR = createWheel(1.2, 1.5);
        const wRL = createWheel(-1.2, -1.5);
        const wRR = createWheel(1.2, -1.5);

        // --- OBSTACLES & PARKING ZONE ---
        const obstacles = [];
        const obsGeo = new THREE.BoxGeometry(2.4, 1.2, 5);
        const obsMat = new THREE.MeshStandardMaterial({ color: 0x2255ff, metalness: 0.2 });

        // Generate parked cars
        const parkedPositions = [[-6, 15], [6, 20], [-6, 25], [6, 35]];
        parkedPositions.forEach(pos => {
            const obs = new THREE.Mesh(obsGeo, obsMat);
            obs.position.set(pos[0], 0.6, pos[1]);
            obs.castShadow = true;
            obs.receiveShadow = true;
            scene.add(obs);
            obstacles.push(obs);
        });

        // Concrete barriers
        const barrierGeo = new THREE.BoxGeometry(20, 1, 1);
        const barrierMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
        const barrier = new THREE.Mesh(barrierGeo, barrierMat);
        barrier.position.set(0, 0.5, 45);
        barrier.receiveShadow = true;
        scene.add(barrier);
        obstacles.push(barrier);

        // Parking Zone (Highlighted Area)
        const zoneGroup = new THREE.Group();
        zoneGroup.position.set(-6, 0.05, 35);
        scene.add(zoneGroup);

        const zoneLineGeo = new THREE.PlaneGeometry(3.5, 6);
        const zoneLineMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, transparent: true, opacity: 0.8 });
        const zoneMesh = new THREE.Mesh(zoneLineGeo, zoneLineMat);
        zoneMesh.rotation.x = -Math.PI / 2;
        zoneGroup.add(zoneMesh);
        
        // Inner glow for parking spot
        const glowGeo = new THREE.PlaneGeometry(3.3, 5.8);
        const glowMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.2 });
        const glowMesh = new THREE.Mesh(glowGeo, glowMat);
        glowMesh.rotation.x = -Math.PI / 2;
        zoneGroup.add(glowMesh);

        // --- GAME PHYSICS & LOGIC ---
        let gameState = 'MENU'; // MENU, PLAYING, RESULTS
        let velocity = 0;
        let steeringAngle = 0;
        let carHeading = 0;
        
        // Tuned Physics parameters
        const MAX_SPEED = 0.4;
        const MAX_REVERSE = -0.2;
        const ACCEL = 0.008;
        const BRAKE_FORCE = 0.015;
        const FRICTION = 0.985;
        const MAX_STEER = 0.6;
        const STEER_SPEED = 0.05;

        let damage = 0;
        let timeLeft = 45;
        let timerInterval;

        const inputs = { gas: false, brake: false, left: false, right: false };

        // Touch Controls
        const bindBtn = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); inputs[key] = false; });
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); inputs[key] = true; });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); inputs[key] = false; });
            btn.addEventListener('mouseleave', (e) => { e.preventDefault(); inputs[key] = false; });
        };
        bindBtn('btn-gas', 'gas');
        bindBtn('btn-brake', 'brake');
        bindBtn('btn-left', 'left');
        bindBtn('btn-right', 'right');

        // --- GAME LOOP FUNCTIONS ---
        function startGame() {
            car.position.set(0, 0, 0);
            carHeading = 0;
            velocity = 0;
            steeringAngle = 0;
            damage = 0;
            timeLeft = 45;
            
            document.getElementById('damage').innerText = damage;
            document.getElementById('damage').className = '';
            document.getElementById('timer').innerText = timeLeft;
            
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            
            gameState = 'PLAYING';
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(gameState === 'PLAYING') {
                    timeLeft--;
                    document.getElementById('timer').innerText = timeLeft;
                    if(timeLeft <= 0) endGame(false, "TIME UP!");
                }
            }, 1000);
        }

        function endGame(success, titleText) {
            gameState = 'RESULTS';
            clearInterval(timerInterval);
            
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            
            const titleEl = document.getElementById('result-title');
            titleEl.innerText = titleText;
            titleEl.style.color = success ? "#00ffcc" : "#ff3366";

            if(success) {
                // Calculate precise scoring
                const distToCenter = car.position.distanceTo(zoneGroup.position);
                const angleDiff = Math.abs((carHeading % Math.PI) - (zoneGroup.rotation.y % Math.PI));
                
                const timeBonus = timeLeft * 10;
                const damagePen = damage * 5;
                let accBonus = 500 - Math.floor(distToCenter * 100) - Math.floor(angleDiff * 100);
                if (accBonus < 0) accBonus = 0;

                const total = 1000 + timeBonus - damagePen + accBonus;

                document.getElementById('score-time').innerText = "+" + timeBonus;
                document.getElementById('score-damage').innerText = "-" + damagePen;
                document.getElementById('score-accuracy').innerText = "+" + accBonus;
                document.getElementById('score-total').innerText = total;
            } else {
                document.getElementById('score-time').innerText = "0";
                document.getElementById('score-damage').innerText = "-" + (damage * 5);
                document.getElementById('score-accuracy').innerText = "0";
                document.getElementById('score-total').innerText = "FAIL";
            }
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('retry-btn').addEventListener('click', startGame);

        // --- ANIMATION & PHYSICS TICK ---
        function animate() {
            requestAnimationFrame(animate);

            if (gameState === 'PLAYING') {
                // 1. Calculate Acceleration & Braking
                if (inputs.gas) {
                    velocity += ACCEL;
                    if (velocity > MAX_SPEED) velocity = MAX_SPEED;
                } else if (inputs.brake) {
                    velocity -= BRAKE_FORCE;
                    if (velocity < MAX_REVERSE) velocity = MAX_REVERSE;
                } else {
                    velocity *= FRICTION; // Coasting
                }

                // 2. Calculate Steering (Ackermann approximation)
                if (inputs.left) {
                    steeringAngle += STEER_SPEED;
                    if(steeringAngle > MAX_STEER) steeringAngle = MAX_STEER;
                } else if (inputs.right) {
                    steeringAngle -= STEER_SPEED;
                    if(steeringAngle < -MAX_STEER) steeringAngle = -MAX_STEER;
                } else {
                    // Auto-center steering
                    steeringAngle *= 0.8;
                }

                // Apply steering to front wheels visually
                wFL.rotation.y = steeringAngle;
                wFR.rotation.y = steeringAngle;

                // 3. Apply Velocity to Position based on Heading
                // Car only turns if it's moving
                if (Math.abs(velocity) > 0.001) {
                    const turnRadius = 2.4 / Math.sin(steeringAngle); // wheelbase / sin(angle)
                    const angularVelocity = velocity / turnRadius;
                    carHeading += angularVelocity;
                    
                    // Spin wheels visually based on velocity
                    const wheelSpin = velocity / wheelRadius;
                    wFL.rotation.x -= wheelSpin;
                    wFR.rotation.x -= wheelSpin;
                    wRL.rotation.x -= wheelSpin;
                    wRR.rotation.x -= wheelSpin;
                }

                car.rotation.y = carHeading;
                car.position.x += Math.sin(carHeading) * velocity;
                car.position.z += Math.cos(carHeading) * velocity;

                // 4. Collision Detection (OBB / Bounding Box)
                car.updateMatrixWorld();
                const carBox = new THREE.Box3().setFromObject(chassis);
                
                let crashed = false;
                obstacles.forEach(obs => {
                    const obsBox = new THREE.Box3().setFromObject(obs);
                    if (carBox.intersectsBox(obsBox)) crashed = true;
                });

                if (crashed) {
                    velocity = -velocity * 0.4; // Bounce
                    damage += 15;
                    document.getElementById('damage').innerText = damage;
                    if(damage >= 50) document.getElementById('damage').classList.add('damage-high');
                    
                    if (damage >= 100) {
                        endGame(false, "CAR TOTALLED!");
                    }
                }

                // 5. Parking Detection
                const zoneBox = new THREE.Box3().setFromObject(zoneMesh);
                if (carBox.intersectsBox(zoneBox) && Math.abs(velocity) < 0.01) {
                    // Check if car is fully inside and aligned
                    const dist = car.position.distanceTo(zoneGroup.position);
                    if (dist < 1.5) {
                        endGame(true, "PERFECT PARK!");
                    } else if (dist < 2.5) {
                        endGame(true, "PARKED OKAY.");
                    }
                }

                // 6. Camera Follow (Dynamic chase camera)
                const camOffset = new THREE.Vector3(
                    -Math.sin(carHeading) * 12,
                    6,
                    -Math.cos(carHeading) * 12
                );
                const targetCamPos = car.position.clone().add(camOffset);
                
                // Smooth camera interpolation
                camera.position.lerp(targetCamPos, 0.1);
                camera.lookAt(car.position.x, car.position.y + 1, car.position.z);
            }

            renderer.render(scene, camera);
        }

        animate();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
